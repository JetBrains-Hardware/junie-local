name: Deploy to S3

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "File name to download from https://junie-local.erokhins.com/ and upload to S3 (the matching .sha256 file is uploaded too)"
        required: true
        type: string

permissions:
  id-token: write   # Required for OIDC token to assume AWS role
  contents: read

env:
  SOURCE_BASE_URL: https://junie-local.erokhins.com
  S3_BASE_URI: s3://download-prod-cdn.jetbrains.com/resources/junie-local
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-1

      - name: Download and upload archive
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          curl --fail --location --progress-bar \
            "$SOURCE_BASE_URL/$FILENAME" \
            | aws s3 cp \
              - \
              "$S3_BASE_URI/$FILENAME" \
              --acl private \
              --region "$AWS_REGION" \
              --no-guess-mime-type

      - name: Download and upload SHA256 checksum
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          curl --fail --location --progress-bar \
            "$SOURCE_BASE_URL/$FILENAME.sha256" \
            | aws s3 cp \
              - \
              "$S3_BASE_URI/$FILENAME.sha256" \
              --acl private \
              --region "$AWS_REGION" \
              --no-guess-mime-type
